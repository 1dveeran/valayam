name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  proto_lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: bufbuild/buf-setup-action@v1
    - name: Lint proto files
      uses: bufbuild/buf-lint-action@v1
      with:
        input: crates/valayam-proto/proto
    - name: Check backward compatibility (against main)
      uses: bufbuild/buf-breaking-action@v1
      with:
        input: crates/valayam-proto/proto
        against: https://github.com/${{ github.repository }}.git#branch=main,ref=HEAD~1,subdir=crates/valayam-proto/proto

  build_and_test:
    strategy:
      matrix:
        rust: [stable, beta]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v3
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v3
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
        components: clippy, rustfmt
        targets: wasm32-unknown-unknown

    - name: Format Check
      run: cargo fmt --all -- --check

    - name: Clippy (Linter)
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Build WASM plugins
      run: |
        for plugin in plugins-wasm/*/; do
          if [ -f "${plugin}Cargo.toml" ]; then
            echo "Building WASM plugin: $(basename $plugin)"
            cargo build --manifest-path "${plugin}Cargo.toml" --target wasm32-unknown-unknown --release
          fi
        done

    - name: Build Project
      run: cargo build --verbose

    - name: Run Tests
      run: cargo test --verbose