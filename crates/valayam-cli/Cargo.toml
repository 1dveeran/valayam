[package]
name = "valayam-cli"
version.workspace = true
edition.workspace = true

[dependencies]
tokio-util = { version = "0.7", features = ["rt"] }
tokio = { workspace = true }
clap = { workspace = true }
walkdir.workspace = true
valayam-core = { path = "../valayam-core" }
valayam-core-net = { path = "../valayam-core-net" }
valayam-engine = { workspace = true }
valayam-models = { workspace = true }
valayam-network = { workspace = true }
indicatif = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "registry", "env-filter"] }
tracing-appender = "0.2.5"
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = "0.32"
tonic = { workspace = true }
prost = { workspace = true }
rcgen = "0.14"
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
dirs = "6.0"
time = "0.3"
reqwest = { workspace = true }
hyper = { version = "1.10", features = ["full"] }
serde_yaml = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
genpdf = "0.2.0"
zip.workspace = true
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
rand.workspace = true
colored = "3.1.1"
chrono = { workspace = true }
hex.workspace = true
hmac = "0.13"
sha2 = "0.11"
uuid = { version = "1.24.0", features = ["v4"] }
dotenvy = "0.15"
[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile.workspace = true
