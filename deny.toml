# cargo-deny configuration for Valayam.
# See https://github.com/EmbarkStudios/cargo-deny for reference.

[licenses]
unlicensed = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "CC0-1.0",
]
deny = [
    "GPL-2.0",
    "GPL-3.0",
    "AGPL-3.0",
]
default = "deny"
confidence_threshold = 0.8

[bans]
multiple-versions = "deny"
wildcards = "allow"
highlight = "all"
skip = [
    # Multiple versions pulled in by transitive deps — suppress for now
    { name = "bitflags", version = "1" },
    { name = "bitflags", version = "2" },
    { name = "hashbrown", version = "0.14" },
    { name = "indexmap", version = "2" },
    { name = "tracing", version = "0.1" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []

[advisories]
vulnerability = "deny"
unmaintained = "deny"
notice = "warn"
severity-threshold = "low"
ignore = []